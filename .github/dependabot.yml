# 보안 업데이트는 자동, 버전 업데이트는 월 1회 묶음 (github-workflow.md §11)
version: 2
updates:
  - package-ecosystem: "terraform"
    directory: "/infra/terraform/envs/aws-main"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 3
    groups:
      all: { patterns: ["*"] }
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "monthly" }
