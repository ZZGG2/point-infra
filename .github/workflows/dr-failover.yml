# AWS 리전/사업자 장애 시 GCP Pilot Light 가동
# 설계: docs/06-disaster-recovery/dr-runbook.md
# AWS 리소스에 의존하는 단계가 없어야 한다 (ADR-0010)
#
# 실행 순서 주의: Cloud SQL 은 Private IP 전용이라 GitHub-hosted runner 에서 psql 로 접속할 수 없다.
#  → runner 에서는 GCP API(gcloud, Terraform)만 쓰고, DB 에 SQL 을 실행하는 단계(RPO 기록, 승격, 보정)는
#    GKE 가 생긴 뒤 클러스터 안의 일회성 Pod/Job 으로 Private IP 를 통해 실행한다.
name: dr-failover
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "장애 선언 사유 (인시던트 번호 등)"
        required: true
      drill:
        description: "DR 훈련 여부 (true 면 DNS 전환 생략)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency: { group: dr, cancel-in-progress: false }

jobs:
  failover:
    runs-on: ubuntu-latest          # GitHub-hosted (AWS 비의존)
    environment: dr-production      # Required reviewers 승인 필요 (ADR-0011)
    timeout-minutes: 40
    env:
      DRILL: ${{ inputs.drill }}   # true 면 실 Cloud SQL 대신 클론 인스턴스를 승격 (복제 유지)
    steps:
      - uses: actions/checkout@v4
      - name: 시작 시각 기록
        run: echo "START=$(date +%s)" >> $GITHUB_ENV

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DR_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3

      # --- runner 에서 실행: GCP API 만 사용 (DB 접속 없음) ---
      - name: "[3] Cloud SQL 준비 (드릴: 클론 생성 / 실전: 인스턴스 확인) — gcloud API"
        run: ./scripts/dr/promote-cloudsql.sh prepare

      - name: "[4-5] GKE + ArgoCD 생성"
        working-directory: infra/terraform/envs/gcp-dr-compute
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false

      # --- GKE 안에서 실행: Private IP 로 Cloud SQL 접속 (kubectl run/Job) ---
      - name: "[6] 마지막 복제 시각 기록 (RPO 근거) — 클러스터 내부 Pod"
        run: ./scripts/dr/record-rpo.sh

      - name: "[7] Cloud SQL 승격 (계정 전환, 시퀀스·지갑 잔액 보정) — 클러스터 내부 Job"
        run: ./scripts/dr/promote-cloudsql.sh promote

      - name: "[8] monolith Ready 대기"
        run: ./scripts/dr/wait-ready.sh

      - name: "[9] DNS 전환"
        if: ${{ !inputs.drill }}
        run: ./scripts/dr/switch-dns.sh to-gcp

      - name: "[10] 스모크 테스트"
        env:
          DR_BASE_URL: ${{ vars.DR_BASE_URL }}   # 미설정이면 스크립트가 즉시 실패한다 (잘못된 주소로 "통과" 방지)
        run: ./scripts/dr/smoke-test.sh

      - name: RTO 기록
        if: always()
        run: echo "RTO(승인 후) = $(( $(date +%s) - START ))초" | tee -a $GITHUB_STEP_SUMMARY
