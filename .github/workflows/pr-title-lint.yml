# PR 제목 = Squash 커밋 메시지 → Conventional Commits 강제
name: pr-title-lint
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  pull-requests: read
jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            infra
            docs
            test
            refactor
            chore
            ci
            hotfix
          requireScope: false
