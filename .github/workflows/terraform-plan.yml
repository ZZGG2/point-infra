name: terraform-plan
on:
  pull_request:
    paths: ["infra/terraform/**"]

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      matrix: { env: [aws-main, gcp-dr-standby, gcp-dr-compute] }
    defaults:
      run: { working-directory: "infra/terraform/envs/${{ matrix.env }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive ../..
      - name: tflint
        uses: terraform-linters/setup-tflint@v6
      - run: tflint --recursive
      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with: { directory: "infra/terraform", soft_fail: true }
      # TODO: 클라우드 인증 (aws-main → AWS OIDC / gcp-* → GCP WIF)
      - run: terraform init -input=false
      - run: terraform plan -input=false -no-color
      # TODO: plan 결과 PR 코멘트
