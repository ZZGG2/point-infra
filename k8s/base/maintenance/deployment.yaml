# DR 모드에서 /api/events/** 에 503 + 점검 안내를 반환 (ADR-0004)
apiVersion: v1
kind: ConfigMap
metadata:
  name: maintenance-nginx
data:
  default.conf: |
    server {
      listen 8080;
      location / {
        default_type application/json;
        return 503 '{"code":"EVENT_MAINTENANCE","message":"이벤트는 시스템 점검으로 일시 중단되었습니다."}';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maintenance
spec:
  replicas: 1
  selector:
    matchLabels: { app: maintenance }
  template:
    metadata:
      labels: { app: maintenance }
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports: [{ containerPort: 8080 }]
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/conf.d }
      volumes:
        - name: conf
          configMap: { name: maintenance-nginx }
---
apiVersion: v1
kind: Service
metadata:
  name: maintenance
spec:
  selector: { app: maintenance }
  ports: [{ port: 80, targetPort: 8080 }]
