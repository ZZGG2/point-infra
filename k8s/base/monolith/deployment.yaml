apiVersion: apps/v1
kind: Deployment
metadata:
  name: monolith
  labels: { app: monolith }
spec:
  replicas: 2
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: monolith }
  template:
    metadata:
      labels: { app: monolith }
    spec:
      serviceAccountName: monolith
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: monolith
          image: monolith:latest   # overlay 에서 레지스트리/태그 치환
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: monolith-config }
            - secretRef: { name: monolith-db }      # External Secrets 가 생성
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { memory: 1Gi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 60
          lifecycle:
            preStop: { exec: { command: ["sleep", "10"] } }
---
apiVersion: v1
kind: Service
metadata:
  name: monolith
spec:
  selector: { app: monolith }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: monolith
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: monolith
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: monolith }
