# 검증용: overlays/aws + local 프로필(데모 사용자·잔액 시드, 데모 이벤트 evt-local, 로컬 관리 API)
# 실서비스에는 쓰지 않는다. envs/aws-main 의 apps_path 로 선택.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../aws
configMapGenerator:
  - name: monolith-config
    behavior: merge
    literals: ["SPRING_PROFILES_ACTIVE=local,aws"]
  - name: event-config
    behavior: merge
    literals: ["SPRING_PROFILES_ACTIVE=local,aws"]
