# RDS 에 앱 전용 계정 app_rw 생성 (멱등, security.md §3). 마스터 계정은 이 Job 에만 주입된다.
# ArgoCD Sync 단계에서 ExternalSecret(wave -2) → Job(wave -1) → 앱(wave 0) 순서로 실행.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: aws-sm }
  target: { name: db-bootstrap }
  dataFrom:
    - extract: { key: point-main/db-bootstrap }   # PGHOST, PGUSER, PGPASSWORD, PGDATABASE, APP_PASSWORD
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      securityContext: { runAsNonRoot: true, runAsUser: 70 }   # postgres 이미지의 postgres 사용자
      containers:
        - name: psql
          image: postgres:16-alpine
          envFrom:
            - secretRef: { name: db-bootstrap }
          env:
            - { name: PGSSLMODE, value: require }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              psql -v ON_ERROR_STOP=1 -v app_pw="$APP_PASSWORD" <<'SQL'
              SELECT 'CREATE ROLE app_rw LOGIN' WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'app_rw')\gexec
              ALTER ROLE app_rw WITH LOGIN PASSWORD :'app_pw';
              GRANT CONNECT, CREATE ON DATABASE point TO app_rw;
              GRANT USAGE, CREATE ON SCHEMA public TO app_rw;
              SQL
              echo "app_rw ready"
