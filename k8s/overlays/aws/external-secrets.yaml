# AWS Secrets Manager(Terraform 이 엔드포인트·자격 증명을 기록) → K8s Secret (env 로 주입)
# 시크릿 이름은 base 매니페스트와 동일하게 유지 → GCP DR 오버레이는 gcp-sm 스토어로 같은 이름을 만든다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: monolith-db
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: aws-sm }
  target: { name: monolith-db }
  dataFrom:
    - extract: { key: point-main/monolith }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: event-service-env
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: aws-sm }
  target: { name: event-service-env }
  dataFrom:
    - extract: { key: point-main/event-service }
