# Gateway API (AWS Load Balancer Controller → ALB)
# 경로 규칙(HTTPRoute)은 클라우드 중립. AWS 전용 값은 GatewayClass / LoadBalancerConfiguration / TargetGroupConfiguration 에만 둔다.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: aws-alb
spec:
  controllerName: gateway.k8s.aws/alb
---
apiVersion: gateway.k8s.aws/v1
kind: LoadBalancerConfiguration
metadata:
  name: point-alb
spec:
  loadBalancerName: point-main-alb        # Terraform(envs/aws-main)이 이 이름으로 조회해 WAF 연결
  scheme: internet-facing
  securityGroups: [point-main-alb]        # Terraform 생성 SG (관리자 IP 만 허용, 도메인·ACM 후 443 공개)
  manageBackendSecurityGroupRules: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: point
spec:
  gatewayClassName: aws-alb
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: point-alb
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      # TODO: Route 53 도메인 + ACM 확보 후 HTTPS 443 리스너 추가, 80 → 443 리다이렉트
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: point
spec:
  parentRefs:
    - name: point
      sectionName: http
  rules:
    - matches: [{ path: { type: PathPrefix, value: /api/events } }]
      backendRefs: [{ name: event-service, port: 80 }]
    - matches: [{ path: { type: PathPrefix, value: /api } }]
      backendRefs: [{ name: monolith, port: 80 }]
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: web, port: 80 }]
---
# 대상 그룹: 파드 IP 직접 등록 + 서비스별 헬스체크
apiVersion: gateway.k8s.aws/v1
kind: TargetGroupConfiguration
metadata:
  name: monolith
spec:
  targetReference: { name: monolith }
  defaultConfiguration:
    targetType: ip
    healthCheckConfig:
      healthCheckPath: /actuator/health/readiness
      healthCheckPort: "8080"
      healthCheckProtocol: HTTP
---
apiVersion: gateway.k8s.aws/v1
kind: TargetGroupConfiguration
metadata:
  name: event-service
spec:
  targetReference: { name: event-service }
  defaultConfiguration:
    targetType: ip
    healthCheckConfig:
      healthCheckPath: /actuator/health/readiness
      healthCheckPort: "8081"
      healthCheckProtocol: HTTP
---
apiVersion: gateway.k8s.aws/v1
kind: TargetGroupConfiguration
metadata:
  name: web
spec:
  targetReference: { name: web }
  defaultConfiguration:
    targetType: ip
    healthCheckConfig:
      healthCheckPath: /healthz
      healthCheckPort: "8080"
      healthCheckProtocol: HTTP
