# ※ ADR-0014 로 Gateway API(Gateway + HTTPRoute)로 교체 예정 — 구현 단계에서 gateway.yaml 로 대체한다
#   (프론트 web 파드 라우팅 "/" 도 그때 추가, ADR-0015)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
    # alb.ingress.kubernetes.io/certificate-arn: <ACM ARN>
    # alb.ingress.kubernetes.io/wafv2-acl-arn: <WAF ARN>
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api/events
            pathType: Prefix
            backend: { service: { name: event-service, port: { number: 80 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: monolith, port: { number: 80 } } }
