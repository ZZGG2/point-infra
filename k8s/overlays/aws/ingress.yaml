apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: point-main-alb   # Terraform(envs/aws-main)이 이 이름으로 조회해 CloudFront 오리진에 연결
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # TLS 는 CloudFront 에서 종료. ALB 는 CloudFront 오리진 대역 + 관리자 IP 만 허용하는 SG(Terraform 생성) 사용
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/security-groups: point-main-alb
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
    # TODO: 도메인·ACM 확보 후 HTTPS 443 + certificate-arn (현재는 CloudFront 기본 인증서)
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api/events
            pathType: Prefix
            backend: { service: { name: event-service, port: { number: 80 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: monolith, port: { number: 80 } } }
