apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/monolith
  - ../../base/event-service
  - ingress.yaml
configMapGenerator:
  - name: monolith-config
    literals: [SPRING_PROFILES_ACTIVE=aws, KAFKA_ENABLED=true, DR_MODE=false]
  - name: event-config
    literals: [SPRING_PROFILES_ACTIVE=aws]
images:   # CI 가 태그를 자동 커밋
  - name: monolith
    newName: ACCOUNT_ID.dkr.ecr.ap-northeast-2.amazonaws.com/monolith
    newTag: "0.1.0"
  - name: event-service
    newName: ACCOUNT_ID.dkr.ecr.ap-northeast-2.amazonaws.com/event-service
    newTag: "0.1.0"
