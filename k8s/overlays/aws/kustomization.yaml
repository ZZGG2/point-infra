apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/monolith
  - ../../base/event-service
  - ../../base/web
  - external-secrets.yaml
  - db-init.yaml
  - gateway.yaml
configMapGenerator:
  - name: monolith-config
    literals: [SPRING_PROFILES_ACTIVE=aws, KAFKA_ENABLED=true, DR_MODE=false]
  - name: event-config
    literals: [SPRING_PROFILES_ACTIVE=aws]
# 이미지(ECR 주소·태그)는 저장소에 계정 ID 를 남기지 않도록 ArgoCD Application(spec.source.kustomize.images)이
# 주입한다 → infra/terraform/modules/aws/argocd-bootstrap
