# Gateway API (GKE Gateway Controller → Global External Application LB)
# 경로 규칙은 overlays/aws 와 같은 형태. 차이: GatewayClass, /api/events → maintenance (선택적 복구, ADR-0004)
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: point
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
    - type: NamedAddress
      value: dr-ingress-ip          # gcp-dr-standby 에서 사전 예약한 Global Static IP
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      # TODO: 도메인 확보 후 HTTPS 443 (Certificate Manager)
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: point
spec:
  parentRefs:
    - name: point
      sectionName: http
  rules:
    - matches: [{ path: { type: PathPrefix, value: /api/events } }]
      backendRefs: [{ name: maintenance, port: 80 }]
    - matches: [{ path: { type: PathPrefix, value: /api } }]
      backendRefs: [{ name: monolith, port: 80 }]
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: web, port: 80 }]
---
# GKE LB 헬스체크 경로 (서비스별)
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: monolith
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck: { requestPath: /actuator/health/readiness, port: 8080 }
  targetRef: { group: "", kind: Service, name: monolith }
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: web
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck: { requestPath: /healthz, port: 8080 }
  targetRef: { group: "", kind: Service, name: web }
