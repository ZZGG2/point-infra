apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: dr-ingress-ip   # gcp-dr-standby 에서 사전 예약
spec:
  rules:
    - http:
        paths:
          - path: /api/events
            pathType: Prefix
            backend: { service: { name: maintenance, port: { number: 80 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: monolith, port: { number: 80 } } }
