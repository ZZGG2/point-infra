# 선택적 복구: monolith + web + maintenance 만 배포. event-service 없음. (ADR-0004)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/monolith
  - ../../base/web
  - ../../base/maintenance
  - gateway.yaml
configMapGenerator:
  - name: monolith-config
    literals: [SPRING_PROFILES_ACTIVE=gcp-dr, KAFKA_ENABLED=false, DR_MODE=true]
images:   # Artifact Registry (CI 이중 푸시, ADR-0010)
  - name: monolith
    newName: asia-northeast3-docker.pkg.dev/PROJECT_ID/point-apps/monolith
    newTag: "0.1.0"
  - name: web
    newName: asia-northeast3-docker.pkg.dev/PROJECT_ID/point-apps/web
    newTag: "0.1.0"
