# Gateway API CRD + AWS LBC 전용 Gateway CRD + GatewayClass
# ArgoCD Application aws-load-balancer-controller 의 두 번째 source (k8s/argocd/aws/apps.yaml)
# LBC 는 기동할 때 Gateway CRD 가 있어야 Gateway 컨트롤러를 켠다 → sync-wave -1 로 차트보다 먼저 적용
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  argocd.argoproj.io/sync-wave: "-1"
resources:
  # Gateway API 표준 CRD (버전 고정 — 개인 샌드박스 #8·#11 에서 LBC v3.6.x 와 함께 검증)
  - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.0/standard-install.yaml
  # LoadBalancerConfiguration / TargetGroupConfiguration / ListenerRuleConfiguration (LBC 차트에 포함되지 않음)
  - https://raw.githubusercontent.com/kubernetes-sigs/aws-load-balancer-controller/v3.6.3/config/crd/gateway/gateway-crds.yaml
  - gatewayclass.yaml
