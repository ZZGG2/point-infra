# 이벤트 전용 NodePool: Spot 우선, 다양한 인스턴스, 빈 노드 즉시 회수
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: event
spec:
  template:
    metadata:
      labels: { workload: event }
    spec:
      taints:
        - { key: workload, value: event, effect: NoSchedule }
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]     # Spot 부족 시 On-Demand fallback
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
  limits:
    cpu: "400"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  role: KarpenterNodeRole-point-main-eks   # modules/aws/karpenter 출력
  subnetSelectorTerms:
    - tags: { karpenter.sh/discovery: point-main-eks }
  securityGroupSelectorTerms:
    - tags: { karpenter.sh/discovery: point-main-eks }
